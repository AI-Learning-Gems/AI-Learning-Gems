<!-- Highlighter Toolbar Container -->
<div id="highlighter-container">
  <!-- Floating Action Button (above the chatbot FAB) -->
  <button id="highlighter-fab" aria-label="Open Highlighter" data-tooltip="Highlight text">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"></path>
      <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path>
    </svg>
  </button>

  <!-- Toolbar panel (hidden by default) -->
  <div id="highlighter-toolbar" class="highlighter-toolbar hidden">
    <div class="hl-toolbar-header">
      <span class="hl-toolbar-title">Highlighter</span>
      <button id="hl-off-btn" class="hl-icon-btn hl-off-btn" aria-label="Turn off highlighter" title="Turn off">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
        </svg>
      </button>
    </div>

    <div class="hl-color-row">
      <button class="hl-color-swatch active" data-color="hl-yellow" aria-label="Yellow" title="Yellow" style="--swatch-color: #fef08a; --swatch-border: #eab308;"></button>
      <button class="hl-color-swatch" data-color="hl-green" aria-label="Green" title="Green" style="--swatch-color: #bbf7d0; --swatch-border: #22c55e;"></button>
      <button class="hl-color-swatch" data-color="hl-coral" aria-label="Coral" title="Coral" style="--swatch-color: #fca5a5; --swatch-border: #ef4444;"></button>
      <button class="hl-color-swatch" data-color="hl-blue" aria-label="Blue" title="Blue" style="--swatch-color: #bfdbfe; --swatch-border: #3b82f6;"></button>
      <button class="hl-color-swatch" data-color="hl-peach" aria-label="Peach" title="Peach" style="--swatch-color: #fde2c8; --swatch-border: #f59e0b;"></button>
    </div>

    <div class="hl-color-row">
      <button class="hl-color-swatch" data-color="hl-gold" aria-label="Gold" title="Gold" style="--swatch-color: #fcd34d; --swatch-border: #b45309;"></button>
      <button class="hl-color-swatch" data-color="hl-emerald" aria-label="Emerald" title="Emerald" style="--swatch-color: #86efac; --swatch-border: #15803d;"></button>
      <button class="hl-color-swatch" data-color="hl-crimson" aria-label="Crimson" title="Crimson" style="--swatch-color: #f87171; --swatch-border: #b91c1c;"></button>
      <button class="hl-color-swatch" data-color="hl-sky" aria-label="Sky" title="Sky" style="--swatch-color: #93c5fd; --swatch-border: #1d4ed8;"></button>
      <button class="hl-color-swatch" data-color="hl-amber" aria-label="Amber" title="Amber" style="--swatch-color: #fdba74; --swatch-border: #c2410c;"></button>
    </div>

    <div class="hl-color-row">
      <button class="hl-color-swatch" data-color="hl-lavender" aria-label="Lavender" title="Lavender" style="--swatch-color: #e0d4f5; --swatch-border: #8b5cf6;"></button>
      <button class="hl-color-swatch" data-color="hl-lime" aria-label="Lime" title="Lime" style="--swatch-color: #d9f99d; --swatch-border: #84cc16;"></button>
      <button class="hl-color-swatch" data-color="hl-silver" aria-label="Silver" title="Silver" style="--swatch-color: #e2e8f0; --swatch-border: #94a3b8;"></button>
      <button class="hl-color-swatch" data-color="hl-teal" aria-label="Teal" title="Teal" style="--swatch-color: #b2f0ea; --swatch-border: #14b8a6;"></button>
      <button class="hl-color-swatch" data-color="hl-fuchsia" aria-label="Fuchsia" title="Fuchsia" style="--swatch-color: #f0abfc; --swatch-border: #c026d3;"></button>
    </div>

    <div class="hl-actions-row">
      <div class="hl-clear-group">
        <button id="hl-clear-all-btn" class="hl-action-btn">Clear all</button>
        <div id="hl-clear-confirm-row" class="hl-clear-confirm-row" style="display:none;">
          <span class="hl-clear-label">Clear all?</span>
          <button id="hl-clear-confirm" aria-label="Confirm clear all">&#x2713;</button>
          <button id="hl-clear-cancel" aria-label="Cancel clear">&#x2715;</button>
        </div>
      </div>
      <button id="hl-eraser-btn" class="hl-tool-btn" aria-label="Eraser mode" title="Click a highlight to remove it">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 20H7L3 16l9.5-9.5a2.83 2.83 0 0 1 4 0l3 3a2.83 2.83 0 0 1 0 4L11 22"></path>
        </svg>
      </button>
      <span class="hl-count" id="hl-count">0 highlights</span>
    </div>
  </div>

  <!-- Popup that appears when clicking a highlight -->
  <div id="hl-popup" class="hl-popup">
    <button id="hl-popup-ask" class="hl-popup-btn hl-popup-ask">Ask AI</button>
    <span class="hl-popup-divider"></span>
    <button id="hl-popup-erase" class="hl-popup-btn hl-popup-erase">Erase</button>
  </div>
</div>
