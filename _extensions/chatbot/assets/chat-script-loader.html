<!-- Load chat.js: derive path from the CSS link Quarto already generated -->
<script>
(function() {
    var cssLink = document.querySelector('link[href*="chatbot/assets/chat.css"]');
    if (cssLink) {
        var jsPath = cssLink.getAttribute("href").replace("chat.css", "chat.js");
        var s = document.createElement("script");
        s.src = jsPath;
        document.body.appendChild(s);
    } else {
        var s = document.createElement("script");
        s.src = "_extensions/chatbot/assets/chat.js";
        document.body.appendChild(s);
    }
})();
</script>
