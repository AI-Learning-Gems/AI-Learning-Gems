<!-- Chat Interface Container -->
<div id="gemini-chat-container">
  <!-- Chat Sidebar (starts hidden; JS calls closeSidebar() on init) -->
  <div id="gemini-chat-sidebar" class="hidden">
    <div class="chat-header">
      <span class="chat-title">AI Assistant</span>
      <div class="model-selector">
        <select id="chat-model-select" aria-label="Select AI Model">
          <option value="openrouter/free">Auto (Best Free Model)</option>
        </select>
      </div>
      <button id="clear-chat-btn" aria-label="Clear chat history"></button>
      <button id="close-chat-btn" aria-label="Close Chat"></button>
    </div>

    <!-- Auth Section: shows either the auth options or the "connected" state -->
    <div id="chat-auth-section" class="chat-auth-section">
      <!-- State 1: Not connected — show login options -->
      <div id="chat-auth-options" class="chat-auth-options">
        <button id="chat-oauth-btn" class="chat-oauth-btn" aria-label="Sign in with OpenRouter">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Sign in with OpenRouter
        </button>
        <span class="chat-auth-divider">or</span>
        <div class="chat-key-input-row">
          <input id="chat-api-key-input" type="password" placeholder="Paste OpenRouter key..." autocomplete="off" spellcheck="false" />
          <button id="chat-api-key-save" class="chat-key-save-btn">Save</button>
        </div>
      </div>
      <!-- State 2: Connected — show status + clear button -->
      <div id="chat-auth-connected" class="chat-auth-connected" style="display:none;">
        <span id="chat-api-key-status" class="api-key-status connected">Connected</span>
        <span id="chat-auth-method-label" class="chat-auth-method-label"></span>
        <button id="chat-auth-clear" class="chat-auth-clear-btn">Disconnect</button>
      </div>
    </div>

    <div id="chat-messages" class="chat-messages">
      <div class="message system">
        Ask questions using the free AI models on <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">OpenRouter</a>. Your API key never leaves the browser.
      </div>
    </div>

    <div class="chat-input-area">
      <div id="current-selection-indicator" class="hidden">
        <span class="selection-preview"></span>
        <button id="clear-selection-btn" aria-label="Clear selection">&times;</button>
      </div>
      <div class="chat-input-wrapper">
        <textarea id="chat-input" placeholder="Ask about this page..." rows="2"></textarea>
        <button id="send-btn" disabled aria-label="Send message"></button>
      </div>
    </div>
  </div>

  <!-- Floating Action Button -->
  <button id="gemini-chat-fab" aria-label="Open AI Chat" data-tooltip="Chat with AI">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
  </button>

  <!-- Selection Popup Button -->
  <button id="ask-ai-btn">Ask AI</button>
</div>
