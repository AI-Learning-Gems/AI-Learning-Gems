<!-- Chat Interface Container -->
<div id="gemini-chat-container">
  <!-- Chat Sidebar (starts hidden; JS calls closeSidebar() on init) -->
  <div id="gemini-chat-sidebar" class="hidden">
    <div class="chat-header">
      <span class="chat-title">AI Assistant</span>
      <div class="model-selector">
        <select id="chat-model-select" aria-label="Select AI Model">
          <option value="openrouter/free">Auto (Best Free Model)</option>
        </select>
      </div>
      <button id="clear-chat-btn" aria-label="Clear chat history"></button>
      <button id="close-chat-btn" aria-label="Close Chat"></button>
    </div>

    <!-- API Key Bar -->
    <div id="chat-api-key-section" class="chat-api-key-section">
      <span id="chat-api-key-status" class="api-key-status disconnected">No key</span>
      <input id="chat-api-key-input" type="password" placeholder="sk-or-v1-..." autocomplete="off" spellcheck="false" />
      <button id="chat-api-key-save">Save</button>
    </div>

    <div id="chat-messages" class="chat-messages">
      <div class="message system">
        Ask questions using the free AI models on <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">OpenRouter</a>. Your API key never leaves the browser.
      </div>
    </div>

    <div class="chat-input-area">
      <div id="current-selection-indicator" class="hidden">
        <span class="selection-preview"></span>
        <button id="clear-selection-btn" aria-label="Clear selection">&times;</button>
      </div>
      <div class="chat-input-wrapper">
        <textarea id="chat-input" placeholder="Ask about this page..." rows="2"></textarea>
        <button id="send-btn" disabled aria-label="Send message"></button>
      </div>
    </div>
  </div>

  <!-- Floating Action Button -->
  <button id="gemini-chat-fab" aria-label="Open AI Chat" data-tooltip="Chat with AI">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
  </button>

  <!-- Selection Popup Button -->
  <button id="ask-ai-btn">Ask AI</button>
</div>
