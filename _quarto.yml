project:
  type: website
  output-dir: _book
  render:
    - "**/*.qmd"
  pre-render:
    - scripts/generate-listings.py
  post-render:
    - scripts/clean-render-artifacts.sh
    - scripts/build-chat.sh
  preview:
    port: 4200

website:
  title: "AI Learning Gems"
  search: true
  page-navigation: true
  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        icon: house
        href: index.qmd

jupyter: python3

number-sections: true

format:
  html:
    theme:
      - cosmo
      - custom.scss
    grid:
      sidebar-width: 275px
      gutter-width: 3.5em
    toc: true
    toc-depth: 3
    toc-location: left
    code-fold: true
    code-summary: "Show code"
    html-math-method: mathjax
    lightbox: auto
    include-in-header:
      - _extensions/chatbot/assets/csp-header.html
    include-after-body:
      - _extensions/chatbot/include-after.html
      - _extensions/chatbot/assets/chat-script-loader.html
      - _extensions/lightbox-fix.html
    css: _extensions/chatbot/assets/chat.css
    out-width: "95%"

execute:
  error: true       # Continue rendering on code errors

filters:
  - pandoc-ext/diagram
  - exercises
  - chatbot
